<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Shop Admin</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login: the only thing a visitor to this page can see -->
  <section id="login-sec" class="wrap" hidden>
    <form id="login" class="panel login">
      <h1>Owner login</h1>
      <p class="sub">Only the shop owner can sign in here.</p>
      <label class="f">Email<input id="email" type="email" autocomplete="username" required></label>
      <label class="f">Password<input id="password" type="password" autocomplete="current-password" required></label>
      <div id="login-err"></div>
      <button class="btn primary" type="submit">Sign in</button>
      <a href="index.html" class="sub">Back to the shop</a>
    </form>
  </section>

  <!-- Dashboard: shown only after the owner signs in -->
  <div id="dash" hidden>
    <header class="top">
      <div class="wrap bar">
        <div class="brand" id="brand">Admin</div>
        <div class="acts">
          <a class="btn sm" href="index.html" target="_blank" rel="noopener">View shop</a>
          <button class="btn sm" id="signout" type="button">Sign out</button>
        </div>
      </div>
    </header>
    <main class="wrap">
      <nav class="tabs" id="tabs" aria-label="Admin sections"></nav>
      <div id="view"></div>
    </main>
  </div>

  <div id="ov" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="admin.js"></script>
</body>
</html>
